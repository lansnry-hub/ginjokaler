          searchPlaceholder: 'Search by title or artist...', allCategories: 'All categories', japanese: 'Japanese', international: 'International', allSubcategories: 'All styles',
          favorites: 'Favorites', allStyles: 'All styles', original: 'Original', cover: 'Cover', originalLabel: 'Original', coverLabel: 'Cover',
          back: 'Back 10 seconds', play: 'Play', pause: 'Pause', forward: 'Forward 10 seconds', openVideo: 'Open source video', addFavorite: 'Add to favorites', removeFavorite: 'Remove from favorites',
          chooseTrack: 'Choose a track', loading: 'The player is loading. Please try again shortly.', chooseFirst: 'Please choose a track first.', invalidId: 'The video ID is invalid.',
          playerError: 'The video could not be played. Check YouTube restrictions.', htmlError: 'The HTML5 player could not play this video.', deleted: 'This video was deleted or made private.', embedError: 'This video does not allow embedded playback.', fileError: 'YouTube cannot play from a local file. Open http://127.0.0.1:8000/index.html.', originalMeta: 'Original', coverMeta: 'Cover', thumbnailSuffix: 'thumbnail'
        }
      };
      var currentLanguage = 'ja';

      function t(key) {
        return translations[currentLanguage][key] || translations.ja[key] || key;
      }

      function applyLanguage(language) {
        currentLanguage = language;
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : language;
        document.title = t('pageTitle');
        document.querySelectorAll('[data-i18n]').forEach(element => {
          element.innerHTML = t(element.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-attr]').forEach(element => {
          element.dataset.i18nAttr.split(',').forEach(pair => {
            const [attribute, key] = pair.split(':');
            element.setAttribute(attribute, t(key));
          });
        });
        document.querySelectorAll('[data-language]').forEach(button => {
          button.classList.toggle('is-active', button.dataset.language === language);
        });
        document.getElementById('backButton').setAttribute('aria-label', t('back'));
        document.getElementById('backButton').setAttribute('title', t('back'));
        document.getElementById('playButton').setAttribute('aria-label', t('play'));
        document.getElementById('playButton').setAttribute('title', t('play'));
        document.getElementById('forwardButton').setAttribute('aria-label', t('forward'));
        document.getElementById('forwardButton').setAttribute('title', t('forward'));
        updatePauseButton();
        updateFavoritesButton();
        populateSubCategories();
        renderCurrentSongs();
        if (selectedSong) updateNowPlaying(selectedSong);
      }

      document.querySelectorAll('[data-language]').forEach(button => {
        button.addEventListener('click', () => applyLanguage(button.dataset.language));
      });

      // 3. YouTube APIの準備
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var player;
      var playerReady = false;
      var pendingSong = null;
      var selectedSong = null;
      var playbackTimer;
      var favoritesOnly = false;
      var favoriteKeys = new Set(JSON.parse(localStorage.getItem('ginjoplayer-favorites') || '[]'));
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '100%',
          width: '100%',
          playerVars: { rel: 0 },
          events: { onReady: onPlayerReady, onError: showPlayerError }
        });
      }

      function onPlayerReady() {
        playerReady = true;
      }

      // 4. 曲再生の処理
      function getStartTime(song) {
        return Number.isFinite(song.startTime) ? song.startTime : 0;
      }

      function getEndTime(song) {
        return Number.isFinite(song.endTime) ? song.endTime : null;
      }

      function updateNowPlaying(song) {
        document.getElementById('currentTitle').textContent = song.title;
        document.getElementById('currentSinger').textContent = `${t('coverLabel')} · ${song.singer}`;
        document.getElementById('currentOriginal').textContent = `${t('originalLabel')} · ${song.originalArtist}`;
      }

      function songKey(song) {
        return [song.id, song.startTime || 0, song.endTime || '', song.title].join('|');
      }

      function saveFavorites() {
        localStorage.setItem('ginjoplayer-favorites', JSON.stringify([...favoriteKeys]));
      }

      function toggleFavorite(song) {
        const key = songKey(song);
        if (favoriteKeys.has(key)) {
          favoriteKeys.delete(key);
        } else {
          favoriteKeys.add(key);
        }
        saveFavorites();
        renderCurrentSongs();
      }

      function updateFavoritesButton() {
        const button = document.getElementById('favoritesToggle');
        button.textContent = `${favoritesOnly ? '♥' : '♡'} ${t('favorites')}`;
      }

      function playSong(song) {
        selectedSong = song;
        pendingSong = song;
        updateNowPlaying(song);
        renderCurrentSongs();
        document.getElementById('playerMessage').textContent = '';
        if (!/^[A-Za-z0-9_-]{11}$/.test(song.id)) {
          document.getElementById('playerMessage').textContent = t('invalidId');
          return;
        }
        if (!playerReady || !player || !player.loadVideoById) {
          document.getElementById('playerMessage').textContent = t('loading');
          return;
        }
        loadSong(song, true);
      }

      function loadSong(song, shouldPlay = false) {
        const videoOptions = { videoId: song.id, startSeconds: getStartTime(song) };
        const endTime = getEndTime(song);
        if (endTime !== null) {
          videoOptions.endSeconds = endTime;
        }
        player.loadVideoById(videoOptions);
        if (shouldPlay && player.playVideo) {
          player.playVideo();
          setPlaybackButton(true);
        }
        document.getElementById('playerMessage').textContent = '';
        startPlaybackTimer();
      }

      function startPlaybackTimer() {
        clearInterval(playbackTimer);
        playbackTimer = setInterval(() => {
          const endTime = getEndTime(selectedSong);
          if (player && player.getCurrentTime && endTime !== null &&
              player.getCurrentTime() >= endTime) {
            pauseSong();
          }
        }, 250);
      }

      function resumeSong() {
        if (!selectedSong) {
          document.getElementById('playerMessage').textContent = t('chooseFirst');
          return;
        }
        if (!playerReady || !player || !player.playVideo) {
          pendingSong = selectedSong;
          document.getElementById('playerMessage').textContent = t('loading');
          return;
        }
        if (player && player.playVideo) {
          const startTime = getStartTime(selectedSong);
          const endTime = getEndTime(selectedSong);
          const currentTime = player.getCurrentTime ? player.getCurrentTime() : startTime;
          if (endTime !== null && currentTime >= endTime) {
            const videoOptions = { videoId: selectedSong.id, startSeconds: startTime, endSeconds: endTime };
            player.loadVideoById(videoOptions);
          } else {
            player.playVideo();
          }
          setPlaybackButton(true);
          startPlaybackTimer();
        }
      }

      function setPlaybackButton(isPlaying) {
        const button = document.getElementById('stopButton');
        const icon = button.querySelector('.control-icon');
        button.setAttribute('aria-label', isPlaying ? t('pause') : t('play'));
        button.setAttribute('title', isPlaying ? t('pause') : t('play'));
        icon.textContent = isPlaying ? 'Ⅱ' : '▶';
      }

      function updatePauseButton() {
        const isPlaying = player && window.YT && YT.PlayerState && player.getPlayerState() === YT.PlayerState.PLAYING;
        setPlaybackButton(isPlaying);
      }

      function pauseSong() {
        clearInterval(playbackTimer);
        if (player && player.pauseVideo) {
          player.pauseVideo();
          setPlaybackButton(false);
        }
      }

      function seekSong(seconds) {
        if (!player || !player.getCurrentTime || !player.seekTo || !selectedSong) {
          return;
        }
        const currentTime = player.getCurrentTime();
        const startTime = getStartTime(selectedSong);
        const endTime = getEndTime(selectedSong);
        const requestedTime = currentTime + seconds;
        const targetTime = endTime === null
          ? Math.max(startTime, requestedTime)
          : Math.max(startTime, Math.min(endTime, requestedTime));
        player.seekTo(targetTime, true);
      }

      function showPlayerError(event) {
        const messages = {
          2: t('invalidId'),
          5: t('htmlError'),
          100: t('deleted'),
          101: t('embedError'),
          150: t('embedError'),
          153: t('fileError')
        };
        document.getElementById('playerMessage').textContent = messages[event.data] || t('playerError');
      }

      // 5. 画面に曲一覧を表示する処理
      function renderSongs(songArray) {
        const listElement = document.getElementById('songList');
        listElement.innerHTML = ''; // 一旦クリア

        songArray.forEach(song => {
          const item = document.createElement('div');
          item.className = 'song-item';
          if (selectedSong && songKey(selectedSong) === songKey(song)) {
            item.classList.add('is-playing');
          }
          const isFavorite = favoriteKeys.has(songKey(song));
          item.innerHTML = `
            <div class="song-main">
              <img class="song-thumbnail" src="https://img.youtube.com/vi/${song.id}/mqdefault.jpg" alt="${song.title} ${t('thumbnailSuffix')}" loading="lazy">
              <div class="song-details">
                <div class="song-title">${song.title}</div>
                <div class="song-meta">${t('originalMeta')}: ${song.originalArtist}</div>
                <div class="song-meta">${t('coverMeta')}: ${song.singer}</div>
              </div>
            </div>
            <div class="song-actions">
              <span class="badge">${localizedCategory(song.category)}</span>
              <span class="badge">${localizedSubCategory(song.subCategory)}</span>
              <button class="favorite-button${isFavorite ? ' is-favorite' : ''}" type="button" aria-label="${isFavorite ? t('removeFavorite') : t('addFavorite')}" title="${isFavorite ? t('removeFavorite') : t('addFavorite')}">${isFavorite ? '♥' : '♡'}</button>
              <a class="video-link" href="https://www.youtube.com/watch?v=${song.id}" target="_blank" rel="noopener" aria-label="${song.title} ${t('openVideo')}">${t('openVideo')}</a>
            </div>
          `;
          item.onclick = () => playSong(song);
          item.querySelector('.video-link').onclick = event => event.stopPropagation();
          item.querySelector('.favorite-button').onclick = event => {
            event.stopPropagation();
            toggleFavorite(song);
          };
          listElement.appendChild(item);
        });
      }

      function renderCurrentSongs() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const selectedCat = document.getElementById('categorySelect').value;
        const selectedSubCat = document.getElementById('subCategorySelect').value;
        const filtered = songs.filter(song => {
          const matchesSearch = song.title.toLowerCase().includes(searchText) || song.originalArtist.toLowerCase().includes(searchText) || song.singer.toLowerCase().includes(searchText);
          const matchesCat = selectedCat === 'ALL' || song.category === selectedCat;
          const matchesSubCat = selectedSubCat === 'ALL' || song.subCategory === selectedSubCat;
          const matchesFavorite = !favoritesOnly || favoriteKeys.has(songKey(song));
          return matchesSearch && matchesCat && matchesSubCat && matchesFavorite;
        });
        filtered.sort((firstSong, secondSong) => firstSong.title.localeCompare(secondSong.title, 'ja', { sensitivity: 'base' }));
        renderSongs(filtered);
      }

      // 6. 検索・絞り込み処理
      function filterSongs() {
        renderCurrentSongs();
      }

      // 7. 大区分が変わった時に小区分を書き換える処理
      document.getElementById('categorySelect').addEventListener('change', function() {
        const selectedCategory = this.value;
        const subSelect = document.getElementById('subCategorySelect');
        
        subSelect.innerHTML = `<option value="ALL">${t('allStyles')}</option>`;

        if (subCategories[selectedCategory]) {
          subCategories[selectedCategory].forEach(sub => {
            const option = document.createElement('option');
            option.value = sub;
            option.textContent = localizedSubCategory(sub);
            subSelect.appendChild(option);
          });
        } else {
          [...new Set(Object.values(subCategories).flat())].forEach(sub => {
            const option = document.createElement('option');
            option.value = sub;
            option.textContent = localizedSubCategory(sub);
            subSelect.appendChild(option);
          });
        }

        filterSongs();
      });

      // 8. 入力・選択の変更イベント登録
      document.getElementById('searchInput').addEventListener('input', filterSongs);
      document.getElementById('subCategorySelect').addEventListener('change', filterSongs);
      document.getElementById('backButton').addEventListener('click', () => seekSong(-10));
      document.getElementById('playButton').addEventListener('click', resumeSong);
      document.getElementById('stopButton').addEventListener('click', () => {
        if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
          pauseSong();
        } else {
          resumeSong();
        }
      });
      document.getElementById('forwardButton').addEventListener('click', () => seekSong(10));
      document.getElementById('favoritesToggle').addEventListener('click', event => {
        favoritesOnly = !favoritesOnly;
        event.currentTarget.classList.toggle('is-active', favoritesOnly);
        updateFavoritesButton();
        renderCurrentSongs();
      });

      function populateSubCategories() {
        const subSelect = document.getElementById('subCategorySelect');
        const allStyles = [...new Set(Object.values(subCategories).flat())];
        subSelect.innerHTML = `<option value="ALL">${t('allStyles')}</option>`;
        allStyles.forEach(sub => {
          const option = document.createElement('option');
          option.value = sub;
          option.textContent = localizedSubCategory(sub);
          subSelect.appendChild(option);
        });
      }

      function localizedSubCategory(subCategory) {
        const labels = {
          'J-POP': { zh: 'J-Pop', en: 'J-Pop' },
          'アニメソング': { zh: '动漫歌曲', en: 'Anime' },
          'ボカロ': { zh: 'Vocaloid', en: 'Vocaloid' },
          'VOCALOID': { zh: 'Vocaloid', en: 'Vocaloid' },
          'ORIGINAL': { zh: '原创', en: 'Original' },
          'POP': { zh: '流行', en: 'Pop' }
        };
        return currentLanguage === 'ja' ? subCategory : (labels[subCategory]?.[currentLanguage] || subCategory);
      }

      function localizedCategory(category) {
        if (currentLanguage === 'ja') return category;
        return category === '邦楽' ? (currentLanguage === 'zh' ? '日语音乐' : 'Japanese') : (currentLanguage === 'zh' ? '国际音乐' : 'International');
      }

      populateSubCategories();
      renderCurrentSongs();
      applyLanguage('ja');
    </script>
</body>
</html>
