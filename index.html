<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Ginjoplayer | Music Room</title>
    <style>
        :root { --ink: #1f2933; --muted: #6c777d; --paper: #f7f3ed; --card: #fffdf9; --accent: #c6533c; --line: #e6ddd2; --custom-image: none; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Avenir Next", "Hiragino Kaku Gothic ProN", sans-serif; background: var(--paper); }
        body::before { content: ""; position: fixed; inset: 0; z-index: -1; opacity: .45; pointer-events: none; background-image: radial-gradient(#d7c8b8 1px, transparent 1px); background-size: 18px 18px; }
        .page-shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 60px; }
        .masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 8px 0 30px; border-bottom: 1px solid var(--line); }
        .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
        h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 5vw, 62px); font-weight: 400; letter-spacing: -.04em; line-height: .95; }
        .brand-note { width: 280px; max-width: 100%; height: 88px; margin: 0; color: var(--muted); display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; font-size: 13px; line-height: 1.7; text-align: right; }
        .player-card { overflow: hidden; padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 18px 45px rgba(74, 54, 38, .09); }
        .art-strip { min-height: 104px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; color: white; background: linear-gradient(105deg, rgba(31, 41, 51, .95), rgba(117, 54, 43, .88)), var(--custom-image); background-size: cover; background-position: center; border-radius: 11px; }
        .art-strip strong { display: block; margin: 3px 0 2px; overflow: hidden; font-family: Georgia, "Times New Roman", serif; font-size: 29px; font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
        .art-strip small { color: rgba(255,255,255,.7); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
        .art-strip .singer { color: rgba(255,255,255,.72); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
        .player-frame { width: min(100%, 720px); aspect-ratio: 16 / 9; margin: 22px auto 0; overflow: hidden; background: #111820; border-radius: 10px; }
        #player, #player iframe { display: block; width: 100%; height: 100%; }
        .player-controls { display: flex; justify-content: center; gap: 9px; margin-top: 17px; align-items: center; flex-wrap: wrap; }
        .player-controls button { width: 48px; height: 42px; padding: 0; color: var(--ink); border: 1px solid var(--line); border-radius: 99px; background: transparent; cursor: pointer; font: inherit; transition: .2s ease; }
        .player-controls .control-icon { display: inline-block; font-size: 20px; line-height: 1; }
        .player-controls #playButton { width: 58px; color: white; border-color: var(--accent); background: var(--accent); }
        .player-controls #playButton:hover { color: white; border-color: var(--ink); background: var(--ink); }
        .player-controls button:hover { color: white; border-color: var(--accent); background: var(--accent); }
        #playerMessage { min-height: 20px; margin: 10px 0 0; color: #b23d32; font-size: 13px; text-align: center; }
        .library-heading { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin: 54px 0 18px; }
        .library-heading h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 31px; font-weight: 400; }
        .library-heading p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.45; letter-spacing: .02em; text-align: justify; text-align-last: justify; }
        .library-heading p span { display: block; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; }
        input, select { min-height: 42px; padding: 8px 12px; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; background: rgba(255,253,249,.8); font: inherit; }
        #searchInput { flex: 1 1 240px; }
        .song-list { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
        .song-item { padding: 12px; border: 1px solid transparent; border-radius: 10px; background: rgba(255,253,249,.68); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: .2s ease; }
        .song-item:hover { border-color: var(--line); background: var(--card); transform: translateY(-1px); }
        .song-main { display: flex; align-items: center; min-width: 0; }
        .song-title { font-weight: bold; }
        .song-meta { color: var(--muted); font-size: 12px; }
        .badge { padding: 4px 8px; color: var(--accent); border: 1px solid #e8b7ab; border-radius: 99px; font-size: 11px; white-space: nowrap; }
        .song-thumbnail { width: 88px; height: 56px; object-fit: cover; margin-right: 12px; border-radius: 6px; flex-shrink: 0; }
        .song-details { min-width: 0; }
        .song-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .video-link { color: var(--accent); font-size: 12px; white-space: nowrap; }
        @media (max-width: 640px) { .page-shell { width: min(100% - 24px, 1120px); padding-top: 18px; } .masthead, .library-heading { display: block; } .brand-note { margin-top: 14px; align-items: flex-start; text-align: left; } .player-card { padding: 12px; } .art-strip { padding: 15px; } .song-item { align-items: flex-start; } .song-actions { flex-wrap: wrap; justify-content: flex-end; } }
    </style>
</head>
<body>
<main class="page-shell">
  <header class="masthead"><div><p class="eyebrow">music room</p><h1>Zeal Ginjoka<br>音楽部屋</h1></div><p class="brand-note">A reliable Bartender with a shadowy past<br>renowned for his drink and beat-making skills.</p></header>
  <section class="player-card" aria-label="播放器">
    <div class="art-strip"><div><small>Now playing</small><strong id="currentTitle"></strong><span class="singer" id="currentSinger"></span></div><span>✦</span></div>
    <div class="player-frame"><div id="player"></div></div>
    <div class="player-controls"><button id="backButton" type="button" aria-label="10秒戻る" title="10秒戻る"><span class="control-icon" aria-hidden="true">↶</span></button><button id="playButton" type="button" aria-label="再生" title="再生"><span class="control-icon" aria-hidden="true">▶</span></button><button id="stopButton" type="button" aria-label="一時停止" title="一時停止"><span class="control-icon" aria-hidden="true">Ⅱ</span></button><button id="forwardButton" type="button" aria-label="10秒進む" title="10秒進む"><span class="control-icon" aria-hidden="true">↷</span></button></div>
    <div id="playerMessage" role="alert"></div>
  </section>
  <section aria-label="曲库"><div class="library-heading"><h2>Track library</h2><p><span>Browse by Category. Tap to Play.</span><span>カテゴリから探す、曲名をタップして再生</span><span>按类别浏览，点击曲目开始播放</span></p></div><div class="controls"><input type="text" id="searchInput" placeholder="曲名や歌手名で検索..."><select id="categorySelect"><option value="ALL">すべての大区分</option><option value="邦楽">邦楽</option><option value="洋楽">洋楽</option></select><select id="subCategorySelect"><option value="ALL">すべての小区分</option></select></div><div id="songList" class="song-list"></div></section>
</main>

    <script>
      // 1. 楽曲データ（ここを増やすだけで曲を追加できます）
      const songs = [
        { id: 'm8cxxIflbGU', title: 'ONLY YOU', originalArtist: 'Zeal Ginjoka', singer: 'Zeal ginjoka', category: '洋楽', subCategory: 'ORIGINAL' },
        { id: 'rS3dQSF7ZMA', title: 'Molotov Mocktail', originalArtist: 'Zeal Ginjoka', singer: 'Zeal ginjoka',  category: '洋楽', subCategory: 'ORIGINAL' },
        { id: 'mK7Lg5ctItY', title: 'ANTiVENOM', originalArtist: 'Zeal Ginjoka', singer: 'Zeal ginjoka', category: '洋楽', subCategory: 'ORIGINAL' },
        { id: 'nyg_fW5ZDkw', title: 'ヴィンパイア', originalArtist: 'DECO*27', singer: 'Zeal ginjoka', startTime: 221, endTime: 398, category: '邦楽', subCategory: 'ボカロ' },
        { id: 'nyg_fW5ZDkw', title: 'KING', originalArtist: 'Kanria', singer: 'Freodore & Zeal ginjoka', startTime: 489, endTime:623 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'nyg_fW5ZDkw', title: 'フォニイ', originalArtist: 'ツミキ', singer: 'Maria Marionette & Zeal ginjoka', startTime:679 , endTime:865 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'nyg_fW5ZDkw', title: 'グッバイ宣言', originalArtist: 'Chinozo', singer: 'Vezalius Bandage & Zeal ginjoka', startTime:927 , endTime:1087 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'nyg_fW5ZDkw', title: '神っぽいな', originalArtist: 'ピノキオピー', singer: 'Elaine Duvelle & Zeal ginjoka', startTime:1169 , endTime:1365 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'nyg_fW5ZDkw', title: '愛して愛して愛して', originalArtist: 'きくお', singer: 'Uki Violeta & Zeal ginjoka', startTime:1453 , endTime:1696 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'nyg_fW5ZDkw', title: 'モエチャッカファイア', originalArtist: '弐誠', singer: 'Ver Vermillion & Zeal ginjoka', startTime:1752 , endTime:1903 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'nyg_fW5ZDkw', title: 'ダーリンダンス', originalArtist: 'かいりきベア', singer: 'Petra Gurin & Zeal ginjoka', startTime:1972 , endTime:2168 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'nyg_fW5ZDkw', title: '真夜中のドア〜stay with me〜', originalArtist: '松原みき', singer: 'Vantacrow Bringer & Zeal ginjoka', startTime:2262 , endTime:2569 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'nyg_fW5ZDkw', title: 'ファンサ', originalArtist: 'mona（CV：夏川椎菜）', singer: 'Zeal ginjoka', startTime:2647 , endTime:2897 , category: '邦楽', subCategory: 'アニメソング' },
        { id: 'nyg_fW5ZDkw', title: 'BUTCHER VANITY', originalArtist: 'FLAVOR FOLEY', singer: 'Zeal ginjoka', startTime:2984 , endTime:3169 , category: '洋楽', subCategory: 'ボカロ' },
        { id: 'F0C5eWLLdlg', title: 'Medusa\'s Masquerade', originalArtist: 'Zeal Ginjoka', singer: 'Zeal ginjoka', category: '洋楽', subCategory: 'ORIGINAL' },
        { id: 'Xr0Z2raziwE', title: 'Medusa\'s Masquerade(ACT II)', originalArtist: 'Zeal Ginjoka & FLAVOR FOLEY', singer: 'Zeal ginjoka', category: '洋楽', subCategory: 'ORIGINAL' },
        { id: 'zyngx4g-sy4', title: 'Ready Steady', originalArtist: 'Giga', singer: 'Claude Clawmark & Kaelix Debonair & Zeal ginjoka', startTime:274 , endTime:482 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'zyngx4g-sy4', title: 'モア！ジャンプ！モア！', originalArtist: 'ナユタン星人', singer: 'Zeal ginjoka', startTime:1016 , endTime:1200 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'zyngx4g-sy4', title: '地球最後の告白を', originalArtist: 'kemu', singer: 'Kaelix Debonair & Zeal ginjoka', startTime:1670 , endTime:1939 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'zyngx4g-sy4', title: 'drop pop candy', originalArtist: 'れをる', singer: 'Kaelix Debonair & Zeal ginjoka', startTime:2180 , endTime:2405 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'zyngx4g-sy4', title: 'ハッピーシンセサイゼ', originalArtist: 'EasyPop', singer: 'Claude Clawmark & Zeal ginjoka', startTime:2835 , endTime:3065 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'zyngx4g-sy4', title: 'カンタレラ', originalArtist: '黒うさ', singer: 'Kaelix Debonair & Zeal ginjoka', startTime:3738 , endTime:3915 , category: '邦楽', subCategory: 'ボカロ' },
        { id: 'zyngx4g-sy4', title: 'プラスティック・ラブ', originalArtist: '竹内まりや', singer: 'Claude Clawmark & Kaelix Debonair & Zeal ginjoka', startTime:4052 , endTime:4341 , category: '邦楽', subCategory: 'J-POP' }

      ];


      // 2. 大区分ごとの小区分リスト
      const subCategories = {
        '邦楽': ['J-POP', 'アニメソング','ボカロ'],
        '洋楽': ['VOCALOID','ORIGINAL'],
      };

      // 3. YouTube APIの準備
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var player;
      var playerReady = false;
      var pendingSong = null;
      var selectedSong = null;
      var playbackTimer;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '100%',
          width: '100%',
          playerVars: { rel: 0 },
          events: { onReady: onPlayerReady, onError: showPlayerError }
        });
      }

      function onPlayerReady() {
        playerReady = true;
      }

      // 4. 曲再生の処理
      function getStartTime(song) {
        return Number.isFinite(song.startTime) ? song.startTime : 0;
      }

      function getEndTime(song) {
        return Number.isFinite(song.endTime) ? song.endTime : null;
      }

      function updateNowPlaying(song) {
        document.getElementById('currentTitle').textContent = song.title;
        document.getElementById('currentSinger').textContent = `Singer · ${song.singer}`;
      }

      function playSong(song) {
        selectedSong = song;
        pendingSong = song;
        updateNowPlaying(song);
        document.getElementById('playerMessage').textContent = '';
        if (!/^[A-Za-z0-9_-]{11}$/.test(song.id)) {
          document.getElementById('playerMessage').textContent = '動画IDが正しくありません（11文字のYouTube動画IDを設定してください）。';
          return;
        }
        if (!playerReady || !player || !player.loadVideoById) {
          document.getElementById('playerMessage').textContent = '播放器正在加载，准备好后会自动切换到这首歌。';
          return;
        }
        loadSong(song, true);
      }

      function loadSong(song, shouldPlay = false) {
        const videoOptions = { videoId: song.id, startSeconds: getStartTime(song) };
        const endTime = getEndTime(song);
        if (endTime !== null) {
          videoOptions.endSeconds = endTime;
        }
        player.loadVideoById(videoOptions);
        if (shouldPlay && player.playVideo) {
          player.playVideo();
          setPlaybackButton(true);
        }
        document.getElementById('playerMessage').textContent = '';
        startPlaybackTimer();
      }

      function startPlaybackTimer() {
        clearInterval(playbackTimer);
        playbackTimer = setInterval(() => {
          const endTime = getEndTime(selectedSong);
          if (player && player.getCurrentTime && endTime !== null &&
              player.getCurrentTime() >= endTime) {
            pauseSong();
          }
        }, 250);
      }

      function resumeSong() {
        if (!selectedSong) {
          document.getElementById('playerMessage').textContent = 'Please choose a track first.';
          return;
        }
        if (!playerReady || !player || !player.playVideo) {
          pendingSong = selectedSong;
          document.getElementById('playerMessage').textContent = '播放器正在加载，请稍候再按一次播放。';
          return;
        }
        if (player && player.playVideo) {
          const startTime = getStartTime(selectedSong);
          const endTime = getEndTime(selectedSong);
          const currentTime = player.getCurrentTime ? player.getCurrentTime() : startTime;
          if (endTime !== null && currentTime >= endTime) {
            const videoOptions = { videoId: selectedSong.id, startSeconds: startTime, endSeconds: endTime };
            player.loadVideoById(videoOptions);
          } else {
            player.playVideo();
          }
          setPlaybackButton(true);
          startPlaybackTimer();
        }
      }

      function setPlaybackButton(isPlaying) {
        const button = document.getElementById('stopButton');
        const icon = button.querySelector('.control-icon');
        button.setAttribute('aria-label', isPlaying ? '一時停止' : '再生');
        button.setAttribute('title', isPlaying ? '一時停止' : '再生');
        icon.textContent = isPlaying ? 'Ⅱ' : '▶';
      }

      function pauseSong() {
        clearInterval(playbackTimer);
        if (player && player.pauseVideo) {
          player.pauseVideo();
          setPlaybackButton(false);
        }
      }

      function seekSong(seconds) {
        if (!player || !player.getCurrentTime || !player.seekTo || !selectedSong) {
          return;
        }
        const currentTime = player.getCurrentTime();
        const startTime = getStartTime(selectedSong);
        const endTime = getEndTime(selectedSong);
        const requestedTime = currentTime + seconds;
        const targetTime = endTime === null
          ? Math.max(startTime, requestedTime)
          : Math.max(startTime, Math.min(endTime, requestedTime));
        player.seekTo(targetTime, true);
      }

      function showPlayerError(event) {
        const messages = {
          2: '動画IDが正しくありません。',
          5: 'HTML5プレーヤーで再生できません。',
          100: '動画が削除されたか、非公開になっています。',
          101: 'この動画は埋め込み再生が許可されていません。',
          150: 'この動画は埋め込み再生が許可されていません。',
          153: '直接打开本地文件无法播放 YouTube，请通过 http://127.0.0.1:8000/index.html 访问。'
        };
        document.getElementById('playerMessage').textContent = messages[event.data] || '動画を再生できません。YouTube側の制限を確認してください。';
      }

      // 5. 画面に曲一覧を表示する処理
      function renderSongs(songArray) {
        const listElement = document.getElementById('songList');
        listElement.innerHTML = ''; // 一旦クリア

        songArray.forEach(song => {
          const item = document.createElement('div');
          item.className = 'song-item';
          item.innerHTML = `
            <div class="song-main">
              <img class="song-thumbnail" src="https://img.youtube.com/vi/${song.id}/mqdefault.jpg" alt="${song.title}のサムネイル" loading="lazy">
              <div class="song-details">
                <div class="song-title">${song.title}</div>
                <div class="song-meta">原曲：${song.originalArtist}</div>
                <div class="song-meta">歌唱：${song.singer}</div>
              </div>
            </div>
            <div class="song-actions">
              <span class="badge">${song.category}</span>
              <span class="badge">${song.subCategory}</span>
              <a class="video-link" href="https://www.youtube.com/watch?v=${song.id}" target="_blank" rel="noopener" aria-label="${song.title}の元動画をYouTubeで開く">元動画</a>
            </div>
          `;
          item.onclick = () => playSong(song);
          item.querySelector('.video-link').onclick = event => event.stopPropagation();
          listElement.appendChild(item);
        });
      }

      // 6. 検索・絞り込み処理
      function filterSongs() {
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        const selectedCat = document.getElementById('categorySelect').value;
        const selectedSubCat = document.getElementById('subCategorySelect').value;

        const filtered = songs.filter(song => {
          const matchesSearch = song.title.toLowerCase().includes(searchText) ||
                                song.originalArtist.toLowerCase().includes(searchText) ||
                                song.singer.toLowerCase().includes(searchText);
          const matchesCat = selectedCat === 'ALL' || song.category === selectedCat;
          const matchesSubCat = selectedSubCat === 'ALL' || song.subCategory === selectedSubCat;

          return matchesSearch && matchesCat && matchesSubCat;
        });

        filtered.sort((firstSong, secondSong) => firstSong.title.localeCompare(secondSong.title, 'ja', { sensitivity: 'base' }));
        renderSongs(filtered);
      }

      // 7. 大区分が変わった時に小区分を書き換える処理
      document.getElementById('categorySelect').addEventListener('change', function() {
        const selectedCategory = this.value;
        const subSelect = document.getElementById('subCategorySelect');
        
        subSelect.innerHTML = '<option value="ALL">すべての小区分</option>';

        if (subCategories[selectedCategory]) {
          subCategories[selectedCategory].forEach(sub => {
            const option = document.createElement('option');
            option.value = sub;
            option.textContent = sub;
            subSelect.appendChild(option);
          });
        } else {
          [...new Set(Object.values(subCategories).flat())].forEach(sub => {
            const option = document.createElement('option');
            option.value = sub;
            option.textContent = sub;
            subSelect.appendChild(option);
          });
        }

        filterSongs();
      });

      // 8. 入力・選択の変更イベント登録
      document.getElementById('searchInput').addEventListener('input', filterSongs);
      document.getElementById('subCategorySelect').addEventListener('change', filterSongs);
      document.getElementById('backButton').addEventListener('click', () => seekSong(-10));
      document.getElementById('playButton').addEventListener('click', resumeSong);
      document.getElementById('stopButton').addEventListener('click', () => {
        if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
          pauseSong();
        } else {
          resumeSong();
        }
      });
      document.getElementById('forwardButton').addEventListener('click', () => seekSong(10));

      function populateSubCategories() {
        const subSelect = document.getElementById('subCategorySelect');
        const allStyles = [...new Set(Object.values(subCategories).flat())];
        subSelect.innerHTML = '<option value="ALL">すべての小区分</option>';
        allStyles.forEach(sub => {
          const option = document.createElement('option');
          option.value = sub;
          option.textContent = sub;
          subSelect.appendChild(option);
        });
      }

      populateSubCategories();
      renderSongs(songs);
    </script>
</body>
</html>
